name: Build and Deploy (Static Export to Locaweb)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [strapi_update]

permissions:
  contents: read

# Evita dois deploys simultâneos no FTP, sem cancelar o que já está em andamento.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # No nível do job para que o `if` do passo de aviso consiga ler a variável
    env:
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verificar secret do formulário
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
        run: |
          if [ -z "$NEXT_PUBLIC_FORM_ENDPOINT" ]; then
            echo "::error::Secret NEXT_PUBLIC_FORM_ENDPOINT vazio. O formulário de contato ficaria sem destino; deploy abortado."
            exit 1
          fi

      - name: Build (Next static export)
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      - name: Verificar saída do build (out/)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d out ]; then
            echo "::error::A pasta out/ não existe. Build não gerou o site estático."
            exit 1
          fi
          PRODUTOS=$(find out/produtos -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "Páginas de produto/subpasta em out/produtos: $PRODUTOS"
          if [ "$PRODUTOS" -lt 20 ]; then
            echo "::error::Poucas páginas de produto ($PRODUTOS < 20). Provável falha na API do Strapi; deploy abortado."
            exit 1
          fi

      - name: Deploy via FTP using lftp (upload contents of out/)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASS: ${{ secrets.PASS }}
          REMOTE_DIR: /public_html/
          remoteDir: /public_html/
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          echo "Starting lftp deploy to $FTP_HOST -> $REMOTE_DIR (uploading contents of out/)"
          cd out
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "mirror -R --no-perms --parallel=5 --exclude-glob logs* --exclude-glob access_log* --exclude-glob error_log* . \"$REMOTE_DIR\"; bye"

      - name: Done
        run: echo "Deploy finished"

      - name: Avisar n8n em caso de erro
        if: failure() && env.N8N_WEBHOOK_URL != ''
        run: |
          curl --fail --max-time 10 -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"projeto": "Site Tecassistiva", "status": "Falha no Deploy", "log_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true
